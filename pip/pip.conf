# Never let pip install into the system/user Python environment.
#
# A stray `pip install --user` pollutes ~/.local/lib/pythonX.Y/site-packages,
# which is on sys.path for *every* python3 invocation. Packages that ship a
# .pth file (e.g. pip-system-certs) then run on every interpreter start and
# slow down anything that shells out to python.
#
# Use a project venv (`uv sync`) or an isolated tool install
# (`uv tool install <pkg>`) instead.
[global]
require-virtualenv = true
